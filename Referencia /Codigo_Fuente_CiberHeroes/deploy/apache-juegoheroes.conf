# VirtualHost de referencia — juegoheroes.fcv.org
# Copiar a /etc/apache2/sites-available/ y habilitar:
#   sudo a2enmod headers rewrite ssl
#   sudo a2ensite juegoheroes.conf && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName juegoheroes.fcv.org
    Redirect permanent / https://juegoheroes.fcv.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName juegoheroes.fcv.org
    DocumentRoot /var/www/juegoheroes/dist

    SSLEngine on
    # SSLCertificateFile /ruta/fullchain.pem
    # SSLCertificateKeyFile /ruta/privkey.pem

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; script-src 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com"

    Alias /api /var/www/juegoheroes/api
    <Directory /var/www/juegoheroes/api>
        Require all granted
        DirectoryIndex disabled
    </Directory>

    <Directory /var/www/juegoheroes/dist>
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>
</VirtualHost>
